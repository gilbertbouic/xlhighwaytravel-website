name: Sync HQ specials

on:
  schedule:
    # Tuesday 11:00 South Africa Standard Time (UTC+2, no DST)
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install "Pillow>=10.0.0"

      - name: Pull current HQ flyers
        run: python3 scripts/publish_specials.py

      - name: Commit if HQ specials changed
        run: |
          git config user.name "xlhighway-specials-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/specials.json assets/img/specials/hq sitemap.xml
          if git diff --staged --quiet; then
            echo "No HQ specials changes."
          else
            git commit -m "Sync HQ specials ($(date -u +%Y-%m-%d))."
            git push
          fi
