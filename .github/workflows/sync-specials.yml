name: Sync HQ specials

on:
  schedule:
    # Tuesday 11:00 South Africa Standard Time (UTC+2, no DST)
    - cron: "0 9 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install "Pillow>=10.0.0" pytesseract

      - name: Pull current HQ specials into the page
        run: python3 scripts/publish_specials.py

      - name: Commit if specials changed
        run: |
          git config user.name "xlhighway-specials-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specials.html sitemap.xml assets/img/specials/live
          if git diff --staged --quiet; then
            echo "No specials changes."
          else
            git commit -m "Sync current specials ($(date -u +%Y-%m-%d))."
            git push
          fi
