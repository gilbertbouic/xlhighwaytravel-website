name: Prune expired specials

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore script and prune page
        run: |
          git checkout c96d9fd9562baa2f8e9425412e70ad0febf4d354 -- scripts/publish_specials.py || true
          python3 scripts/prune_expired_specials.py
      - name: Commit
        run: |
          git config user.name "xlhighwaytravel-bot"
          git config user.email "22957074+gilbertbouic@users.noreply.github.com"
          git add specials.html scripts/publish_specials.py
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "Remove expired specials"
          git push
