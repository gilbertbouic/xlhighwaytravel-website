name: Force Pages publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drop leftover live Uniworld block
        run: python3 scripts/remove_specials_dupes.py
      - name: Commit
        run: |
          git config user.name "xlhighwaytravel-bot"
          git config user.email "22957074+gilbertbouic@users.noreply.github.com"
          git add specials.html scripts/publish_specials.py
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "Drop leftover live specials cards"
          git push
